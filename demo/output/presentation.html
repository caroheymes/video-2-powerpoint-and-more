<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Débloquer le Potentiel Créatif</title>
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-card: rgba(18, 24, 38, 0.85);
            --border: rgba(255, 255, 255, 0.1);
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-main);
            font-family: var(--font-family);
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
        }

        .deck-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            overflow-x: hidden;
        }

        .slide {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: clamp(1.5rem, 4vw, 3.5rem);
            position: relative;
            background: radial-gradient(circle at 80% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 60%);
        }

        .title-content {
            text-align: center;
            max-width: 900px;
        }

        .badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            color: var(--primary);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 9999px;
            padding: 0.35rem 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            margin-bottom: 1.5rem;
        }

        .gradient-text {
            font-size: clamp(2.2rem, 5vw, 4rem);
            font-weight: 800;
            line-height: 1.15;
            background: linear-gradient(135deg, #ffffff 40%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.2rem;
        }

        .subtitle {
            font-size: clamp(1.1rem, 2vw, 1.5rem);
            color: var(--text-muted);
            margin-bottom: 2.5rem;
        }

        .meta-footer {
            display: flex;
            gap: 2rem;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border);
            padding-top: 1.5rem;
        }

        .content-slide {
            justify-content: flex-start;
            align-items: stretch;
            max-width: 1400px;
            margin: 0 auto;
        }

        .slide-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }

        .slide-number {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary);
            opacity: 0.8;
        }

        .slide-header h2 {
            font-size: clamp(1.5rem, 2.8vw, 2.2rem);
            font-weight: 700;
            flex-grow: 1;
        }

        .kpi-badge {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            background: var(--bg-card);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 8px;
            padding: 0.4rem 0.8rem;
        }

        .kpi-val {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--primary);
        }

        .kpi-lbl {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .slide-body {
            display: flex;
            flex-grow: 1;
            align-items: center;
            gap: 2.5rem;
        }

        .slide-bullets {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: clamp(1.5rem, 2.5vw, 2.2rem);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .slide-bullets ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1.4rem;
        }

        .slide-bullets li {
            font-size: clamp(1.05rem, 1.6vw, 1.35rem);
            line-height: 1.5;
            color: #e2e8f0;
            display: flex;
            align-items: flex-start;
            gap: 0.8rem;
        }

        .bullet-icon {
            color: var(--primary);
            font-size: 1.1rem;
            flex-shrink: 0;
            margin-top: 0.15rem;
        }

        .slide-visual {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slide-visual img {
            max-width: 100%;
            max-height: 55vh;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            object-fit: contain;
        }

        /* Styles d'impression 16:9 stricts */
        @media print {
            @page {
                size: 16in 9in;
                margin: 0;
            }
            html, body, .deck-container {
                width: 16in !important;
                height: auto !important;
                overflow: visible !important;
                background: #0b0f19 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .slide {
                width: 16in !important;
                height: 9in !important;
                min-height: 9in !important;
                max-height: 9in !important;
                page-break-after: always !important;
                break-after: page !important;
                overflow: hidden !important;
            }
            .slide:last-of-type {
                page-break-after: auto !important;
                break-after: auto !important;
            }
        }
    </style>
</head>

    <script>
        // Navigation clavier (Flèches, Espace, PageUp/Down)
        const container = document.getElementById('deck');
        const slides = Array.from(document.querySelectorAll('.slide'));
        let currentIndex = 0;

        window.addEventListener('keydown', (e) => {
            if (['ArrowDown', 'ArrowRight', 'Space', 'PageDown'].includes(e.code)) {
                e.preventDefault();
                currentIndex = Math.min(currentIndex + 1, slides.length - 1);
                slides[currentIndex].scrollIntoView({ behavior: 'smooth' });
            } else if (['ArrowUp', 'ArrowLeft', 'PageUp'].includes(e.code)) {
                e.preventDefault();
                currentIndex = Math.max(currentIndex - 1, 0);
                slides[currentIndex].scrollIntoView({ behavior: 'smooth' });
            }
        });
    </script>
